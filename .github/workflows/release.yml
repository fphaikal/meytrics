name: Release & Publish

on:
  push:
    tags:
      - 'v*' # Trigger on tags like v1.0.0, v1.1.0, etc.

env:
  # Docker Hub
  DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/meytrics
  # GitHub Container Registry
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Extract Release Notes
        id: extract_release_notes
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          # Clean version string (remove v if present in comparison but keep consistent)
          # Actually my CHANGELOG uses [1.2.3] format (no v). The tag is v1.2.3.
          NORMALIZED_VERSION=${VERSION#v}
          
          echo "Extracting notes for version $NORMALIZED_VERSION"
          
          # Extract content between the version header and the next header
          # Matches "## [1.2.3]" until next "## ["
          awk "/^## \[${NORMALIZED_VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md > RELEASE_NOTES.md
          
          # If empty (fallback), usage default logic
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No note found in CHANGELOG.md for $NORMALIZED_VERSION"
            echo "See CHANGELOG.md for details." > RELEASE_NOTES.md
          fi
          
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: RELEASE_NOTES.md
          files: |
            docker-compose.yml
            DEPLOYMENT.md
