services:
  meytrics:
    build: .
    container_name: meytrics
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - meytrics-data:/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/data
      # Change this in production!
      - JWT_SECRET=change-this-secret-in-production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/public/services"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  meytrics-data:
    driver: local
